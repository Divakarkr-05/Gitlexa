name: Security Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0' # Weekly Sunday audit

jobs:
  backend-audit:
    name: Backend Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install audit tools
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Scan backend dependencies
        run: |
          pip-audit -r backend/requirements.txt --desc
        continue-on-error: true # Diagnostic report only; avoids blocking initial foundation

  frontend-audit:
    name: Frontend Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Audit frontend dependencies
        run: |
          cd frontend
          # Audit dependencies without applying automatic destructive fixes
          npm audit --audit-level=high
        continue-on-error: true # Report findings without breaking builds or running npm audit fix --force

  secret-scan:
    name: Secret Leak Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for exposed credential patterns
        run: |
          echo "Scanning tracked files for potential credential patterns..."
          # Print only filenames (never the secrets themselves) to ensure zero credential exposure in logs
          if git grep -l -E 'ghp_[a-zA-Z0-9]{36}|github_pat_[a-zA-Z0-9_]{82}|AKIA[0-9A-Z]{16}' -- ':!*.example' ':!*tests*'; then
            echo "::error::Potential secret pattern detected in the files listed above. Plaintext credentials must never be committed."
            exit 1
          fi
          echo "Secret check passed: zero exposed credential patterns detected."
